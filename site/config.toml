baseurl = "https://websummoner.riadvice.com/"
locale = "en-us"
title = "WebSummoner | Fast Selenium hub, browsers in Docker containers"

enableRobotsTXT = true


# RSS, categories and tags disabled for an easy start
# See configuration options for more details:
# https://gohugo.io/getting-started/configuration/#toml-configuration
disableKinds = ["RSS", "taxonomy"]

[params]
description = "A fast Selenium hub that summons a fleet of browsers into ephemeral, session-scoped Docker containers. Video with sound, live screen and logs. Runs on your own hardware or in any cloud."

# Allow raw HTML (divs for TOC/cross-link cards) inside markdown pages.
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
