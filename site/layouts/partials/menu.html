<div class="header__menu">
    <label for="menu" class="header__menu-button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </label>
    <input id="menu" type="checkbox" style="display:none;">
    <div class="header__menu-wrapper">
        <ul class="header__menu-container" style="display:flex;flex-direction:column;gap:0.75rem;list-style:none;padding:1rem 0;margin:0;">
            {{ range hugo.Data.meta.nav }}
            <li><a href="{{ .url }}">{{ .name }}</a></li>
            {{ end }}
        </ul>
    </div>
</div>
