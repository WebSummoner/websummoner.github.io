<header class="container">
    <div class="row header align-items-center">
        <div class="col-auto">
            <a href="/" class="header__logo">
                <img src="/img/websummoner_logo.svg" alt="logo" class="header__logo-image">
                <span class="header__logo-title">Summoner</span>
            </a>
        </div>
        <nav class="d-none d-sm-block col">
            <ul class="header__links">
                {{ range hugo.Data.meta.nav }}
                <li><a href="{{ .url }}">{{ .name }}</a></li>
                {{ end }}
                <li>
                    <a href="https://github.com/WebSummoner/websummoner" class="header__github"
                       aria-label="WebSummoner on GitHub" title="WebSummoner on GitHub"
                       rel="noopener" target="_blank">{{ partial "icon" "github" }}</a>
                </li>
            </ul>
        </nav>
        <nav class="d-block d-sm-none col">
            {{ partial "menu" . }}
        </nav>
    </div>
</header>
