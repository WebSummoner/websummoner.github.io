<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512">

  <defs>
    <clipPath id="rounded">
      <rect
        width="512"
        height="512"
        rx="65.4"/>
    </clipPath>
  </defs>

  <!-- Black background -->
  <rect
    width="512"
    height="512"
    rx="65.4"
    fill="#050505"/>

  <!-- White field -->
  <circle
    cx="256"
    cy="256"
    r="256"
    fill="#FFFFFF"/>

  <!-- Negative rotated elements -->
  <g clip-path="url(#rounded)">

    <rect
      x="44.8"
      y="-16.4"
      width="58.1"
      height="544.1"
      transform="translate(29.4 -6.7) rotate(6.5)"
      fill="#050505"/>

    <rect
      x="408.1"
      y="-12.7"
      width="58.1"
      height="539.6"
      transform="translate(31.9 -47.9) rotate(6.5)"
      fill="#050505"/>

  </g>

  <!-- Main symbol -->
  <circle
    cx="256"
    cy="256"
    r="182"
    fill="#050505"/>

  <circle
    cx="256"
    cy="256"
    r="128"
    fill="#FFFFFF"/>

  <circle
    cx="256"
    cy="256"
    r="103"
    fill="#050505"/>

  <circle
    cx="256"
    cy="256"
    r="99"
    fill="#FFFFFF"/>

</svg>