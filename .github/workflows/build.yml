name: build

# Push to master  -> build + deploy to GitHub Pages (websummoner.riadvice.com)
# Pull request    -> build only, so a broken template or dead link fails early
# workflow_dispatch -> manual deploy, e.g. after changing the Pages settings
#
# First-time setup (once, in repository Settings -> Pages): choose
# "GitHub Actions" as the source and set the custom domain to
# websummoner.riadvice.com. Publishing from a workflow ignores any CNAME file,
# so the domain is held in the repository settings only.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Official image, pinned: klakegg/hugo stopped at Hugo 0.111 in 2023.
      - name: Build with Hugo
        env:
          # Analytics is opt-in: unset means no tracking code at all.
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID || vars.GA_MEASUREMENT_ID }}
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/project \
            -e HUGO_SERVICES_GOOGLEANALYTICS_ID="$GA_MEASUREMENT_ID" \
            ghcr.io/gohugoio/hugo:v0.165.0 \
            --source /project/site --destination /project/dist --cleanDestinationDir

      - name: Verify output
        run: |
          for f in index.html css/site.css features/index.html browsers/index.html; do
            test -f "dist/$f" || { echo "::error::dist/$f missing"; exit 1; }
          done

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
